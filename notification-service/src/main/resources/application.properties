# =========================
# Spring
# =========================
spring.application.name=notification-service

# =========================
# Datasource
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostel_one?currentSchema=notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.pool-name=notification-hikari

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=notification
spring.flyway.create-schemas=true

# =========================
# Server
# =========================
server.port=${SERVER_PORT:8083}
server.error.include-message=always

# =========================
# JWT (validation only - must match lessor/renter-service's app.jwt.secret)
# =========================
app.jwt.secret=${JWT_SECRET}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# SpringDoc OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Logging
# =========================
logging.level.com.pgm.notification=INFO
