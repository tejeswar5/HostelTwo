# =========================
# Spring
# =========================
spring.application.name=lessor-service

# =========================
# Datasource
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostel_one?currentSchema=lessor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.pool-name=lessor-hikari

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=lessor
spring.flyway.create-schemas=true

# =========================
# Cache
# =========================
spring.cache.cache-names=dashboardAggregates,publicHostelListing
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30s

# =========================
# Server
# =========================
server.port=${SERVER_PORT:8081}
server.error.include-message=always

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET:EE5BqibsCFrZUaY+CwN1XTaQwWXbDg7d+qBQjV9j9S1WmPkZ3xJqljW+70lM2y7w}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:30}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:14}

# =========================
# Encryption
# =========================
app.encryption.key=${FIELD_ENCRYPTION_KEY:cs/S6izZ7YkDjeO+9pDqMvaKimFY2zy58ipoQfF6U7k=}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=lessor-service

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# SpringDoc OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Logging
# =========================
logging.level.com.pgm.lessor=INFO
