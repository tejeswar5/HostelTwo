# =========================
# Spring
# =========================
spring.application.name=lessor-service

# =========================
# Datasource
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hostel_one?currentSchema=lessor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.pool-name=lessor-hikari

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=lessor
spring.flyway.create-schemas=true

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Only needed for a managed instance (e.g. Upstash) - local/docker-compose
# Redis has no password and no TLS.
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# =========================
# Cache (Redis-backed - see config.CacheConfig for TTL/serialization; shared
# across replicas, unlike the old per-JVM Caffeine cache it replaces)
# =========================
spring.cache.type=redis
spring.cache.cache-names=dashboardAggregates,publicHostelListing

# =========================
# Rate limiting (Redis-backed fixed window, see security.RateLimitFilter)
# =========================
app.ratelimit.auth.limit=${RATE_LIMIT_AUTH:10}
app.ratelimit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
app.ratelimit.public.limit=${RATE_LIMIT_PUBLIC:60}
app.ratelimit.public.window-seconds=${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:60}

# =========================
# Server
# =========================
server.port=${SERVER_PORT:8081}
server.error.include-message=always

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:30}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:14}

# =========================
# Encryption
# =========================
app.encryption.key=${FIELD_ENCRYPTION_KEY}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=lessor-service
# Only needed for a managed broker (e.g. Aiven) that requires auth - leave
# unset for local/docker-compose Kafka (PLAINTEXT, no credentials).
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.ssl.trust-store-certificates=${KAFKA_SSL_TRUSTSTORE_CERTIFICATES:}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# SpringDoc OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Logging
# =========================
logging.level.com.pgm.lessor=INFO
